name: IslandClock
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  IslandClock:
    type: application
    platform: iOS
    sources:
      - path: IslandClockApp.swift
      - path: ContentView.swift
      - path: ClockAttributes.swift
      - path: ClockFace.swift
    info:
      path: AppInfo.plist
      properties:
        CFBundleDisplayName: Island Clock
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.islandclock
    dependencies:
      - target: ClockWidget
        embed: true
  ClockWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ClockWidgetBundle.swift
      - path: ClockLiveActivity.swift
      - path: ClockAttributes.swift
      - path: ClockFace.swift
    info:
      path: WidgetInfo.plist
      properties:
        CFBundleDisplayName: Island Clock
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.islandclock.widget
